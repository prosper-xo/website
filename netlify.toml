# Production build settings
[build]
  publish = "_site"
  command = "bundle install && npm install && npm run build"

# Deploy Previews (for pull requests)
[context.deploy-preview]
  publish = "_site"
  command = "bundle install && npm install && JEKYLL_ENV=preview npm run build"

[context.deploy-preview.environment]
  JEKYLL_CONFIG = "_config.yml,_config_preview.yml"

# Branch deploys (for non-production branches)
[context.branch-deploy]
  publish = "_site"
  command = "bundle install && npm install && JEKYLL_ENV=preview npm run build"

[context.branch-deploy.environment]
  JEKYLL_CONFIG = "_config.yml,_config_preview.yml"

# Staging branch (optional - for testing before production)
[context.staging]
  publish = "_site"
  command = "bundle install && npm install && JEKYLL_ENV=staging npm run build"

[context.staging.environment]
  JEKYLL_CONFIG = "_config.yml,_config_preview.yml"

# Headers for better caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Redirect /admin to CMS
[[redirects]]
  from = "/admin"
  to = "/cms/"
  status = 200
  force = true

# Serve CMS config as YAML
[[headers]]
  for = "/cms/config.yml"
  [headers.values]
    Content-Type = "text/yaml"
